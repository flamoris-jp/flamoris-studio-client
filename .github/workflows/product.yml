name: StudioClient product
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: python -m pip install -r product/audio-worker/requirements.txt
      - run: python -m unittest discover -s test/audio -v
      - run: dotnet test test/StudioClient.Tests/StudioClient.Tests.csproj -c Release -p:UseSharedCompilation=false
      - name: Windows build and portable bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./product/packaging/publish-windows.ps1
      - name: Packaged startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process ./artifacts/windows/FLAMORIS-StudioClient-win-x64/StudioClient.exe -ArgumentList '--smoke' -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Startup timed out.' }
          if ($app.ExitCode -ne 0) { throw "Startup failed: $($app.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: FLAMORIS-StudioClient-win-x64
          path: |
            artifacts/windows/FLAMORIS-StudioClient-win-x64.zip
            artifacts/windows/FLAMORIS-StudioClient-win-x64/startup.png
          retention-days: 7
