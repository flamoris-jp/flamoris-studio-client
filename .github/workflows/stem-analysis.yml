name: AudioAnalyzer stem research
on:
  pull_request:
    paths:
      - 'product/audio-worker/**'
      - 'test/stems/**'
      - 'test/audio/**'
      - '.github/workflows/stem-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'product/audio-worker/**'
      - 'test/stems/**'
      - 'test/audio/**'
      - '.github/workflows/stem-analysis.yml'
permissions:
  contents: read
jobs:
  stems:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional research profile
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r product/audio-worker/requirements-stems.txt
      - name: Existing AudioAnalyzer regression tests
        run: python -m unittest discover -s test/audio -v
      - name: Stem CLI and pitch tests
        run: python -m unittest discover -s test/stems -v
